AWSTemplateFormatVersion: "2010-09-09"
Description: Weather app - private S3 bucket served by CloudFront, plus a Lambda function (streaming function URL) that writes the AI forecast summary with Bedrock.

Parameters:
  SummaryCodeBucket:
    Type: String
    Description: S3 bucket that holds the Summary_Service zip
    AllowedPattern: "^[a-z0-9.-]{3,63}$"
  SummaryCodeKey:
    Type: String
    Description: S3 key of the Summary_Service zip
    AllowedPattern: "^[a-zA-Z0-9._/-]+$"
  BedrockModelId:
    Type: String
    Description: Bedrock model ID the Summary_Service may invoke
    AllowedPattern: "^[a-zA-Z0-9.:_-]+$"

Resources:
  # Private bucket that holds index.html, styles.css, and weather.js.
  # CloudFormation generates the bucket name so it is unique.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: weather-app

  # Lets CloudFront sign its requests to the bucket so the bucket policy can admit only this distribution.
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Weather app bucket access for CloudFront
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Browser security headers added to every response.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Weather app security headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://api.weather.gov; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Weather app
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt SiteOAC.Id
          - Id: summary-service
            DomainName: !Select [2, !Split ["/", !GetAtt SummaryFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: summary-service
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            # AWS managed policy "CachingDisabled"
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS managed policy "AllViewerExceptHostHeader"
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: weather-app

  # Execution role for the Summary_Service. Its only Bedrock permission is streaming invocation of the configured model.
  SummaryServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: InvokeSummaryModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The model ID itself: a foundation model or a cross-Region inference profile (us., global., ...)
              - Effect: Allow
                Action: bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}"
              # The foundation model behind the profile, in each Region the profile routes to.
              # Allowed only when the call goes through this stack's inference profile.
              - Effect: Allow
                Action: bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                Condition:
                  StringLike:
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}"
      Tags:
        - Key: Project
          Value: weather-app

  SummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: summary-lambda.handler
      Role: !GetAtt SummaryServiceRole.Arn
      Timeout: 60
      MemorySize: 512
      Code:
        S3Bucket: !Ref SummaryCodeBucket
        S3Key: !Ref SummaryCodeKey
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Tags:
        - Key: Project
          Value: weather-app

  # Public function URL with response streaming. CloudFront sends /api/* here.
  # The function accepts only POST /api/summary with a small validated body.
  SummaryFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt SummaryFunction.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  SummaryUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SummaryFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  SummaryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SummaryFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Only this distribution may read objects, and only over HTTPS.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  BucketName:
    Description: S3 bucket that holds the app files
    Value: !Ref SiteBucket
  BucketRegionalDomainName:
    Description: Direct S3 address, used to show that direct access is denied
    Value: !GetAtt SiteBucket.RegionalDomainName
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront domain name
    Value: !GetAtt Distribution.DomainName
  SummaryFunctionName:
    Description: Lambda function that writes the forecast summary
    Value: !Ref SummaryFunction
  SummaryServiceRoleArn:
    Description: IAM role for the Summary_Service
    Value: !GetAtt SummaryServiceRole.Arn
  SiteURL:
    Description: HTTPS address of the app
    Value: !Sub "https://${Distribution.DomainName}"
