<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background-color: #f0f4f8;
      color: #222;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #city-input {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #aaa;
      border-radius: 4px;
      width: 260px;
    }

    #submit-btn {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #submit-btn:hover {
      background-color: #1d4ed8;
    }

    #error-display {
      color: #b91c1c;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    #weather-display {
      max-width: 600px;
      width: 100%;
    }

    #weather-display table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    #weather-display th,
    #weather-display td {
      border: 1px solid #ccc;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    #weather-display th {
      background-color: #dbeafe;
    }
  </style>
</head>
<body>
  <h1>🌤 Weather App</h1>

  <div class="input-row">
    <input type="text" id="city-input" placeholder="Enter a U.S. city name">
    <button id="submit-btn">Get Weather</button>
  </div>

  <div id="error-display"></div>
  <div id="weather-display"></div>

  <script src="weather.js"></script>
</body>
</html>
