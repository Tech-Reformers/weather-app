<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://api.weather.gov; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🌤 Weather App</h1>

  <div class="input-row">
    <input type="text" id="city-input" placeholder="Enter a U.S. city name">
    <button id="submit-btn">Get Weather</button>
    <button id="unit-toggle">Switch to °C</button>
  </div>

  <div id="error-display"></div>
  <div id="weather-display"></div>
  <div id="summary-panel" hidden><h3>Summary</h3><p id="summary-text"></p></div>

  <script src="weather.js"></script>
</body>
</html>
